# Välimuisti: syöte aina tuoreena, IG-kuvat (nimi = julkaisun id) pitkään.
map $uri $media_cache {
    ~\.webp$  "public, max-age=2592000, immutable";
    default   "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # scripts/ig-sync.sh kirjoittaa syötteen ja kuvat hakemistoon /data/media.
    # Token on hakemistossa /data/state, joka ei näy verkkoon.
    location ^~ /media/ {
        root /data;
        add_header Cache-Control $media_cache;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
